name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: stable-vault-473902-b0
  REGION: asia-northeast3
  SERVICE: product-matcher
  AR_REPO: product-matcher
  RUNTIME_SA: id-648@stable-vault-473902-b0.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 20 \
            --service-account ${{ env.RUNTIME_SA }} \
            --set-secrets GOOGLE_CREDENTIALS_JSON=gcp-service-account:latest,DATABASE_URL=DATABASE_URL:latest \
            --quiet
        # ⚠️ 사람 게이트: Secret Manager 에 DATABASE_URL(롤=r_matching, 읽기전용) 등록 필요.
        # nf_main 이 Cloud SQL 이면 사설IP 또는 --add-cloudsql-instances(+소켓 host)가
        # 추가로 필요할 수 있음 — 형제앱 접속 관례에 맞춰 사람이 확정.
